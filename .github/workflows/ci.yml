name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-app-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Cache by lockfile-ish inputs: any project file change invalidates it.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('hr-app-backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore HrApp.sln

      - name: Build
        run: dotnet build HrApp.sln --no-restore --configuration Release

      # The suite uses the EF in-memory provider, so no SQL Server is needed here.
      - name: Test
        run: >
          dotnet test HrApp.Tests/HrApp.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ../TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: ignore

  migrations:
    name: Migrations are in sync with the model
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-app-backend
    env:
      # dotnet-ef's design-time tooling discovers the DbContext by running the app's own
      # Program.cs, which now builds a JwtSettings before the host exists. These are
      # CI-only placeholders that only need to satisfy that startup-time shape check —
      # nothing here ever signs a real token, so a fixed, non-secret value is fine for
      # issuer/audience/duration. The key itself is generated fresh per run below.
      Jwt__Issuer: ci-model-check
      Jwt__Audience: ci-model-check
      Jwt__DurationInMinutes: '60'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef --version 9.*

      # JwtSettings.Create rejects a missing/short key before the host can build, which is
      # correct in production but means the design-time host EF spins up to discover the
      # DbContext needs *some* syntactically valid key. Generate one fresh for this job run
      # only, mask it so it can't land in logs, and hand it to later steps via GITHUB_ENV —
      # it is never written to a file, appsettings, or committed anywhere.
      - name: Generate an ephemeral JWT signing key for the model check
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "Jwt__Key=$key" >> "$GITHUB_ENV"

      # Catches the common mistake of changing an entity but forgetting the migration.
      # `migrations has-pending-model-changes` exits non-zero when the model and the
      # last migration's snapshot disagree.
      - name: Check for un-migrated model changes
        run: >
          dotnet ef migrations has-pending-model-changes
          --project HrApp.Repository
          --startup-project HrAppWebApplication

  schema:
    name: Schema rules (real SQL Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-app-backend

    # The in-memory provider used by HrApp.Tests ignores foreign keys, unique indexes and
    # filters, so the rules that live only in the schema need a real engine to mean
    # anything. This job builds a throwaway database by running the committed migrations,
    # which also proves the migrations reproduce the model.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'Str0ng!Passw0rd' }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('hr-app-backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test schema rules
        run: >
          dotnet test HrApp.SchemaTests/HrApp.SchemaTests.csproj
          --configuration Release
          --logger "trx;LogFileName=schema-results.trx"
          --results-directory ../TestResults
        env:
          HRAPP_TEST_SQL: >-
            Server=localhost,1433;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD || 'Str0ng!Passw0rd' }};TrustServerCertificate=True;

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-test-results
          path: TestResults/
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-app-frontend-new

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hr-app-frontend-new/package-lock.json

      - name: Install
        run: npm ci

      # CI=true promotes ESLint warnings to errors, so a new unused import or a missing
      # hook dependency fails the build instead of accumulating. The tree is clean as of
      # the commit that turned this on — keep it that way.
      - name: Build
        run: npm run build
        env:
          CI: true
